name: Build Tweak

on:
  push:
    branches: [latest]
    paths:
      - "**.m"
      - "**.mm"
      - "**.h"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions: 
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve iOS SDK path
        id: sdk
        run: echo "path=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_OUTPUT"

      # libogg/libvorbis are no longer vendored or linked - the mobile
      # client already plays Vorbis-coded FSB5 samples natively, so
      # BankTransplant.m's old decode/re-encode pipeline (and its
      # #if __has_include(<vorbis/codec.h>) gate) is gone along with the
      # rest of the re-encode files. Bank swaps are now a direct file
      # copy, no codec linkage required.

      # CrunchTextureDecoder.mm's own #if __has_include("crn_decomp.h")
      # gate (see that file's top comment) means the build still
      # succeeds without this step - DXT5Crunched Texture2D objects just
      # get skipped (texture2DFormatUnsupported) at runtime instead.
      # Pulled fresh from upstream every run rather than checked into
      # this repo: it's a ~4-5k line third-party single-header library
      # (public-domain/zlib-style, credit required - see
      # CrunchTextureDecoder.h's top comment) that belongs staying an
      # untouched upstream pull, not a vendored copy this repo has to
      # keep in sync by hand.
      #
      # crn_decomp.h's own top comment calls itself a fully stand-alone
      # single-file library, but it isn't quite - line 16 is
      # `#include "crnlib.h"`, just to pull in a handful of basic
      # CRN-related types (crn_uint32 and friends), not anything from
      # the actual crn COMPRESSION side. So crnlib.h has to be fetched
      # alongside it into the same -I inc directory, even though this
      # project never calls into crnlib itself.
      - name: Fetch crn_decomp.h
        run: |
          mkdir -p inc
          curl -fsSL -o inc/crn_decomp.h \
            https://raw.githubusercontent.com/BinomialLLC/crunch/master/inc/crn_decomp.h
          curl -fsSL -o inc/crnlib.h \
            https://raw.githubusercontent.com/BinomialLLC/crunch/master/inc/crnlib.h
          test -s inc/crn_decomp.h
          test -s inc/crnlib.h

          # Apple's iOS SDK doesn't ship a top-level malloc.h (it's
          # <malloc/malloc.h>, with plain malloc/free coming from
          # <stdlib.h>). Upstream crn_decomp.h unconditionally does
          # `#include <malloc.h>`, which is a Linux/Windows-ism and
          # breaks the isysroot'd clang compile below. Patch it in
          # place right after fetching, before anything tries to
          # include it - note the `-i ''` (empty-string arg) is
          # required for macOS/BSD sed, unlike GNU sed.
          sed -i '' 's/#include <malloc.h>/#include <malloc\/malloc.h>/' inc/crn_decomp.h

          # crn_decomp.h's allocator calls malloc_usable_size(), which
          # is glibc/Linux-only. Apple's <malloc/malloc.h> has the same
          # thing under a different name: malloc_size(). Same
          # signature (size_t f(const void*)), safe global rename.
          sed -i '' 's/malloc_usable_size/malloc_size/g' inc/crn_decomp.h

          # crn_decomp.h predates ARM64 - its "is this a 64-bit
          # platform" check for the ptr_bits typedef only tests
          # `_WIN64` / `__x86_64__`, so on arm64 it silently falls
          # through to `typedef uint32 ptr_bits`. The alignment-check
          # asserts then reinterpret_cast a real 64-bit pointer down
          # into that 32-bit type, which arm64 clang correctly refuses
          # to compile (cast from pointer to smaller type loses
          # information). Widen the platform check to also catch
          # arm64/aarch64 (and 64-bit generally via __LP64__).
          sed -i '' 's/#ifdef __x86_64__/#if defined(__x86_64__) || defined(__aarch64__) || defined(__arm64__) || defined(__LP64__)/' inc/crn_decomp.h

          # Two of the alignment asserts cast the raw pointer straight
          # to `(uint32)` instead of going through ptr_bits at all -
          # same underlying bug, needs its own fix even after the
          # typedef above is corrected.
          sed -i '' 's/(uint32)p_new & (CRND_MIN_ALLOC_ALIGNMENT - 1)/(ptr_bits)p_new \& (CRND_MIN_ALLOC_ALIGNMENT - 1)/g' inc/crn_decomp.h

          # The remaining three sites do reinterpret_cast<ptr_bits>(p)
          # correctly, but then immediately truncate that back down
          # with a stray leading (uint32) cast - drop it now that
          # ptr_bits is properly 64-bit wide on this target.
          sed -i '' 's/(uint32)reinterpret_cast<ptr_bits>(p) & (CRND_MIN_ALLOC_ALIGNMENT - 1)/reinterpret_cast<ptr_bits>(p) \& (CRND_MIN_ALLOC_ALIGNMENT - 1)/g' inc/crn_decomp.h

      # CrunchTextureDecoder.mm is Objective-C++ (crn_decomp.h is C++ -
      # namespaces, the crnd_unpack_context typedef, etc. - see that
      # file's own top comment on why it can't be a plain .m). clang's
      # single-invocation-on-*.m trick below can't mix a .mm source into
      # that same command, so this compiles it to its own object file
      # first and the main invocation links the .o in and adds -lc++
      # for the C++ runtime (Xcode adds that automatically when a
      # target contains a .mm; the raw clang command below does not).
      - name: Compile CrunchTextureDecoder.mm (Objective-C++)
        run: |
          clang \
            -c \
            -O2 \
            -fobjc-arc \
            -fmodules \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -I inc \
            CrunchTextureDecoder.mm \
            -o CrunchTextureDecoder.o

      # All .m files compile as one dylib in a single clang
      # invocation - small enough project that per-file .o caching
      # isn't worth the extra steps. Headers (FPS120LinkWatcher.h,
      # IL2CppBridge.h, DebugConsole.h) don't need separate
      # compilation; they're pulled in via #import.
      #
      # -fobjc-arc is required: FPS120LinkWatcher.h and the other
      # files use ARC-style `strong`/`assign` property attributes.
      #
      # Texture2DFields.m / Texture2DPixelDecoder.m / RawPixelPacker.m /
      # SerializedObjectTable.m / TextureAtlasTransplant.m are the
      # object-level texture-transplant pipeline (see
      # TextureAtlasTransplant.h) - added alongside CrunchTextureDecoder.o
      # below now that GraphicsDebugOverlay.m's mod-import flow actually
      # calls into TextureAtlasTransplant instead of BundleTransplant's
      # old whole-file swap for bundles.
      #
      # Adjust -miphoneos-version-min if your deployment target
      # differs - 15.0 covers all ProMotion (120Hz-capable) devices.
      #
      # -DZS_BUILD_NUMBER=<run number> stamps the same counter the
      # "Publish release" step below already tags each build with
      # (build-${{ github.run_number }}) into the binary itself, so the
      # panel's header version tag (see gd_version_string in
      # GraphicsDebugOverlay.m) updates on its own with every push -
      # no version bump needed here beyond the "v0.0.1" prefix baked
      # into that function.
      - name: Compile tweak dylib
        run: |
          clang \
            -dynamiclib \
            -O2 \
            -fobjc-arc \
            -fmodules \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -DZS_BUILD_NUMBER=${{ github.run_number }} \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreText \
            -framework UniformTypeIdentifiers \
            -install_name "@rpath/ZSingularity.dylib" \
            fps120.m \
            ZCrashLogger.m \
            IL2CppBridge.m \
            GraphicsDebugOverlay.m \
            GDScripts.m \
            ZSyslogController.m \
            BankTransplant.m \
            BundleTransplant.m \
            UnityBundleCAB.m \
            LZ4BlockDecoder.m \
            PatchManifestNetwork.m \
            ModAssetLibrary.m \
            Texture2DFields.m \
            Texture2DPixelDecoder.m \
            RawPixelPacker.m \
            SerializedObjectTable.m \
            TextureAtlasTransplant.m \
            CrunchTextureDecoder.o \
            PlatformBundleRetarget.m \
            -lc++ \
            -o ZSingularity.dylib

      # Ad-hoc sign so the dylib is well-formed on its own; patch-ipa.yml
      # presumably re-signs/embeds it into the app bundle's signature
      # anyway when it injects into the executable via insert_dylib.
      - name: Ad-hoc codesign
        run: codesign -f -s - ZSingularity.dylib

      - name: Verify architecture
        run: lipo -info ZSingularity.dylib

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          files: ZSingularity.dylib
          tag_name: build-${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
