name: Build Tweak

on:
  push:
    branches: [main]
    paths:
      - "**.m"
      - "**.h"
      - "FSB5VorbisSetupTable.bin"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve iOS SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "path=${SDK_PATH}" >> "$GITHUB_OUTPUT"
          echo "version=${SDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using iPhoneOS SDK ${SDK_VERSION} at ${SDK_PATH}"

      # BankTransplant.m uses <vorbis/codec.h> and the libvorbis decoder.
      # libvorbis itself requires libogg, so both libraries are built as
      # static arm64/iPhoneOS libraries and linked into the dylib.
      - name: Build libogg for iOS arm64
        shell: bash
        env:
          SDK_PATH: ${{ steps.sdk.outputs.path }}
        run: |
          set -euo pipefail

          OGG_VERSION="1.3.5"
          PREFIX="$PWD/.deps/iphoneos-arm64"
          SRC="$RUNNER_TEMP/libogg-${OGG_VERSION}"
          BUILD="$RUNNER_TEMP/libogg-build"

          rm -rf "$SRC" "$BUILD"
          git clone --depth 1 --branch "v${OGG_VERSION}" \
            https://github.com/xiph/ogg.git "$SRC"

          cmake -S "$SRC" -B "$BUILD" \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${SDK_PATH}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DINSTALL_DOCS=OFF \
            -DINSTALL_PKG_CONFIG_MODULE=OFF \
            -DINSTALL_CMAKE_PACKAGE_MODULE=ON

          cmake --build "$BUILD" --config Release --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install "$BUILD" --config Release

          test -f "$PREFIX/include/ogg/ogg.h"
          test -f "$PREFIX/lib/libogg.a"

          echo "libogg.a architecture:"
          xcrun lipo -info "$PREFIX/lib/libogg.a"

      - name: Build libvorbis for iOS arm64
        shell: bash
        env:
          SDK_PATH: ${{ steps.sdk.outputs.path }}
        run: |
          set -euo pipefail

          VORBIS_VERSION="1.3.7"
          PREFIX="$PWD/.deps/iphoneos-arm64"
          SRC="$RUNNER_TEMP/libvorbis-${VORBIS_VERSION}"
          BUILD="$RUNNER_TEMP/libvorbis-build"

          rm -rf "$SRC" "$BUILD"
          git clone --depth 1 --branch "v${VORBIS_VERSION}" \
            https://github.com/xiph/vorbis.git "$SRC"

          cmake -S "$SRC" -B "$BUILD" \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${SDK_PATH}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DINSTALL_CMAKE_PACKAGE_MODULE=ON

          cmake --build "$BUILD" --config Release --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install "$BUILD" --config Release

          test -f "$PREFIX/include/vorbis/codec.h"
          test -f "$PREFIX/lib/libvorbis.a"
          test -f "$PREFIX/lib/libvorbisenc.a"

          echo "libvorbis.a architecture:"
          xcrun lipo -info "$PREFIX/lib/libvorbis.a"

      - name: Verify Vorbis headers and archives
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$PWD/.deps/iphoneos-arm64"

          test -f "$PREFIX/include/vorbis/codec.h"
          test -f "$PREFIX/include/vorbis/vorbisfile.h"
          test -f "$PREFIX/lib/libvorbis.a"
          test -f "$PREFIX/lib/libogg.a"

          echo "Vorbis decoder symbols present:"
          nm -gU "$PREFIX/lib/libvorbis.a" | grep -E 'vorbis_(info_init|synthesis_headerin|synthesis|synthesis_pcmout)' | head -20

      # All source files are compiled into one dylib. The static Vorbis/Ogg
      # archives are linked directly into it, so the target app does not need
      # to ship separate libvorbis.dylib/libogg.dylib files.
      - name: Compile tweak dylib
        shell: bash
        env:
          SDK_PATH: ${{ steps.sdk.outputs.path }}
        run: |
          set -euo pipefail

          PREFIX="$PWD/.deps/iphoneos-arm64"

          clang \
            -dynamiclib \
            -fobjc-arc \
            -fmodules \
            -isysroot "${SDK_PATH}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -I"${PREFIX}/include" \
            -L"${PREFIX}/lib" \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreText \
            -framework UniformTypeIdentifiers \
            -install_name "@rpath/ZSingularity.dylib" \
            fps120.m \
            IL2CppBridge.m \
            GraphicsDebugOverlay.m \
            GDScripts.m \
            ZSyslogController.m \
            BankTransplant.m \
            FADPCMCodec.m \
            FSB5HeaderRebuild.m \
            FSB5SampleHeaderIO.m \
            FSB5VorbisExtract.m \
            VorbisSetupTable.m \
            -Wl,-force_load,"${PREFIX}/lib/libvorbis.a" \
            -Wl,-force_load,"${PREFIX}/lib/libogg.a" \
            -lm \
            -lc++ \
            -Wl,-sectcreate,__DATA,__fsb5setup,FSB5VorbisSetupTable.bin \
            -o ZSingularity.dylib

      - name: Verify linked libraries
        shell: bash
        run: |
          set -euo pipefail

          echo "=== dylib architecture ==="
          xcrun lipo -info ZSingularity.dylib

          echo "=== embedded Vorbis/Ogg symbols ==="
          nm -gU ZSingularity.dylib | grep -E 'vorbis_(info_init|synthesis_headerin|synthesis|synthesis_pcmout)' | head -20

          echo "=== dynamic dependencies ==="
          otool -L ZSingularity.dylib

      # Ad-hoc sign so the dylib is well-formed on its own; patch-ipa.yml
      # can re-sign/embed it into the application bundle later.
      - name: Ad-hoc codesign
        run: codesign -f -s - ZSingularity.dylib

      - name: Verify final code signature
        run: codesign --verify --verbose ZSingularity.dylib

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          files: ZSingularity.dylib
          tag_name: build-${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
