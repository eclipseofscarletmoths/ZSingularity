name: Build Tweak

on:
  push:
    branches: [latest]
    paths:
      - "**.m"
      - "**.mm"
      - "**.h"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve iOS SDK path
        id: sdk
        run: echo "path=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_OUTPUT"

      - name: Fetch LZ4 reference library
        run: |
          set -euo pipefail
          LZ4_REF=v1.10.0
          BASE="https://raw.githubusercontent.com/lz4/lz4/${LZ4_REF}/lib"
          for f in lz4.h lz4.c lz4hc.h lz4hc.c; do
            curl -fsSL "${BASE}/${f}" -o "$f"
          done
          shasum -a 256 lz4.h lz4.c lz4hc.h lz4hc.c > lz4-checksums.txt
          shasum -a 256 -c lz4-checksums.txt

      - name: Compile tweak dylib
        run: |
          clang \
            -dynamiclib \
            -O2 \
            -fobjc-arc \
            -fmodules \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -DZS_BUILD_NUMBER=${{ github.run_number }} \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreText \
            -framework UniformTypeIdentifiers \
            -framework Security \
            -lcompression \
            -install_name "@rpath/ZSingularity.dylib" \
            -I. \
            -ICore -IUI -IMods -IBundleTools -ITranscoder -INetwork -IDiagnostics -IResources \
            Core/fps120.m \
            Diagnostics/ZCrashLogger.m \
            Core/IL2CppBridge.m \
            UI/UserInterface.m \
            Core/ZSScripts.m \
            Diagnostics/ZSyslogController.m \
            Mods/BankTransplant.m \
            Network/PatchManifestNetwork.m \
            Transcoder/ZTranscoderService.m \
            Transcoder/ZTranscoderSettings.m \
            Transcoder/ZTranscoderInstaller.m \
            Mods/ModAssetLibrary.m \
            BundleTools/LZ4BlockDecoder.m \
            lz4.c \
            lz4hc.c \
            BundleTools/UnityBundleCAB.m \
            BundleTools/UnityCacheLocator.m \
            BundleTools/ZSFileIndex.m \
            Mods/LunartiqueModArchive.m \
            -o ZSingularity.dylib

      - name: Ad-hoc codesign
        run: codesign -f -s - ZSingularity.dylib

      - name: Verify architecture
        run: lipo -info ZSingularity.dylib

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          files: ZSingularity.dylib
          tag_name: build-${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

