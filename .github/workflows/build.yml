name: Build Tweak

on:
  push:
    branches: [ManifestIntercept]
    paths:
      - "**.m"
      - "**.h"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions: 
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve iOS SDK path
        id: sdk
        run: echo "path=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_OUTPUT"

      # BankTransplant.m's Vorbis decode path is gated behind
      # `#if __has_include(<vorbis/codec.h>)` - it silently no-ops (every
      # re-encode fails with BankTransplantErrorVorbisDecodeFailed)
      # unless that header is actually on the include path. Apple's SDKs
      # don't ship libvorbis, and there's no system copy to link against
      # on-device, so it has to be vendored and cross-compiled for
      # arm64/iphoneos ourselves rather than just adding -lvorbis.
      #
      # This builds libogg (BSD-licensed, xiph/ogg) and libvorbis
      # (BSD-licensed, xiph/vorbis) from source, targeting the same
      # arch/SDK/deployment-target as the tweak itself, and archives
      # each into a static lib. Pinned to known-good release tags rather
      # than tracking a branch so the build doesn't silently change out
      # from under you.
      #
      # libogg normally gets config_types.h generated by its autoconf
      # ./configure step; we're cross-compiling without running that, so
      # a minimal hand-written one is dropped in instead - it's just
      # ogg's int types mapped onto <stdint.h>, which is what configure
      # itself resolves to on every LP64 platform Apple ships anyway.
      - name: Fetch libogg + libvorbis sources
        run: |
          git clone --depth 1 --branch v1.3.5 https://github.com/xiph/ogg.git vendor/ogg-src
          git clone --depth 1 --branch v1.3.7 https://github.com/xiph/vorbis.git vendor/vorbis-src

          mkdir -p vendor/ogg/include/ogg
          cp -R vendor/ogg-src/include/ogg/*.h vendor/ogg/include/ogg/
          cat > vendor/ogg/include/ogg/config_types.h <<'EOF'
          #ifndef __CONFIG_TYPES_H__
          #define __CONFIG_TYPES_H__
          #include <stdint.h>
          typedef int16_t ogg_int16_t;
          typedef uint16_t ogg_uint16_t;
          typedef int32_t ogg_int32_t;
          typedef uint32_t ogg_uint32_t;
          typedef int64_t ogg_int64_t;
          typedef uint64_t ogg_uint64_t;
          #endif
          EOF

      - name: Build libogg (arm64, iphoneos)
        run: |
          mkdir -p build/ogg
          cd build/ogg
          for f in bitwise framing; do
            clang -c -O2 \
              -isysroot "${{ steps.sdk.outputs.path }}" \
              -arch arm64 \
              -miphoneos-version-min=15.0 \
              -I "$GITHUB_WORKSPACE/vendor/ogg/include" \
              "$GITHUB_WORKSPACE/vendor/ogg-src/src/$f.c" \
              -o "$f.o"
          done
          ar rcs libogg.a bitwise.o framing.o

      # Explicit source list, not a glob over lib/*.c: libvorbis's lib/
      # directory also contains psytune.c (a standalone offline psy-
      # model tuning tool with its own main() - never part of the
      # actual library, just shipped alongside it) which a glob picks
      # up and fails to compile. This list is libvorbis's own
      # lib/Makefile.am SOURCES, minus vorbisfile.c - that's the
      # stdio-based stream/page demuxing API, unneeded since
      # BankTransplant.m feeds raw packets straight off FSB5's own
      # length-prefixed stream, bypassing ogg_sync/ogg_stream entirely.
      - name: Build libvorbis (arm64, iphoneos)
        run: |
          mkdir -p build/vorbis
          cd build/vorbis
          SRC="$GITHUB_WORKSPACE/vendor/vorbis-src/lib"
          FILES="analysis bitrate block codebook envelope floor0 floor1 info lookup lpc lsp mapping0 mdct psy registry res0 sharedbook smallft synthesis vorbisenc window"
          OBJS=()
          for name in $FILES; do
            clang -c -O2 \
              -isysroot "${{ steps.sdk.outputs.path }}" \
              -arch arm64 \
              -miphoneos-version-min=15.0 \
              -I "$GITHUB_WORKSPACE/vendor/ogg/include" \
              -I "$GITHUB_WORKSPACE/vendor/vorbis-src/include" \
              -I "$SRC" \
              "$SRC/$name.c" \
              -o "$name.o"
            OBJS+=("$name.o")
          done
          ar rcs libvorbis.a "${OBJS[@]}"

      # All four .m files compile as one dylib in a single clang
      # invocation - small enough project that per-file .o caching
      # isn't worth the extra steps. Headers (FPS120LinkWatcher.h,
      # IL2CppBridge.h, DebugConsole.h) don't need separate
      # compilation; they're pulled in via #import.
      #
      # -fobjc-arc is required: FPS120LinkWatcher.h and the other
      # files use ARC-style `strong`/`assign` property attributes.
      #
      # Adjust -miphoneos-version-min if your deployment target
      # differs - 15.0 covers all ProMotion (120Hz-capable) devices.
      #
      # -I vendor/ogg|vorbis/include is what makes BankTransplant.m's
      # `#if __has_include(<vorbis/codec.h>)` actually resolve to 1;
      # -L + -lvorbis -logg link the static libs built above (order
      # matters here - vorbis's objects reference ogg's, so -lvorbis
      # has to come first for the linker to know it needs -logg's symbols).
      # -O2: this step previously built at clang's default -O0. Fine for
      # everything except FADPCMCodec.m's encoder, whose innermost loop
      # (8 coefs x 16 shifts x 32 samples, per 32-sample group) depends on
      # fadpcm_decode_sample actually getting inlined - at -O0 the re-encode
      # of a real bank was taking minutes; this should get most of that back.
      - name: Compile tweak dylib
        run: |
          clang \
            -dynamiclib \
            -O2 \
            -fobjc-arc \
            -fmodules \
            -isysroot "${{ steps.sdk.outputs.path }}" \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            -framework AVFAudio \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreText \
            -framework UniformTypeIdentifiers \
            -I vendor/ogg/include \
            -I vendor/vorbis-src/include \
            -install_name "@rpath/ZSingularity.dylib" \
            fps120.m \
            ZCrashLogger.m \
            IL2CppBridge.m \
            GraphicsDebugOverlay.m \
            GDScripts.m \
            ZSyslogController.m \
            BankTransplant.m \
            BundleTransplant.m \
            UnityBundleCAB.m \
            LZ4BlockDecoder.m \
            PatchManifestSync.m \
            PatchManifestNetworkPOC.m \
            FADPCMCodec.m \
            FSB5HeaderRebuild.m \
            FSB5SampleHeaderIO.m \
            FSB5VorbisExtract.m \
            VorbisSetupTable.m \
            -Lbuild/vorbis -Lbuild/ogg \
            -lvorbis -logg \
            -lc++ \
            -Wl,-sectcreate,__DATA,__fsb5setup,FSB5VorbisSetupTable.bin \
            -o ZSingularity.dylib

      # Ad-hoc sign so the dylib is well-formed on its own; patch-ipa.yml
      # presumably re-signs/embeds it into the app bundle's signature
      # anyway when it injects into the executable via insert_dylib.
      - name: Ad-hoc codesign
        run: codesign -f -s - ZSingularity.dylib

      - name: Verify architecture
        run: lipo -info ZSingularity.dylib

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          files: ZSingularity.dylib
          tag_name: build-${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
